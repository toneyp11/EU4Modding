l_english:
 AUTOMATION_TOOLS_BTN:0 "Automation"
 AUTOMATION_TOOLS_BTN_TT:0 "Open or close the §YAutomation Tools§! panel."
 AUTOMATION_TOOLS_TITLE:0 "§YAutomation Tools§!"
 AUTOMATION_CLOSE_TT:0 "Close"
 ATOOLS_CEDE_LABEL:0 "Shrink largest"
 ATOOLS_CEDE_TT:0 "When §Yon§!, every set number of months the nation with the highest total development is shrunk. §YFirst§!, it releases every nation it can as §Yindependent§! states; if nothing can be released, it instead cedes one border province to its §Yweakest neighbour§!. Keeps any single nation from snowballing out of control."
 ATOOLS_INTERVAL_CYCLE:0 "Change interval"
 ATOOLS_INTERVAL_CYCLE_TT:0 "Click to cycle the shrink interval between §Y1§!, §Y6§!, §Y12§! and §Y24§! months. Current value is shown below."
 ATOOLS_CEDE_STATUS_TT:0 "Interval, how many shrinks succeeded, and how many runs fired but could do nothing - nothing releasable anywhere and no cede-able target."
 ATOOLS_CONVERT_LABEL:0 "Convert religion/culture"
 ATOOLS_CONVERT_TT:0 "When §Yon§!, every §Yconvert interval§! each owned province whose religion or culture differs from its owner's has a 20%% chance to §Yconvert toward the owner§! (including same-group cases like Catholic to Orthodox that the AI never does). The map homogenises §Ygradually§! over time rather than all at once. This interval is §Yseparate§! from the shrink interval."
 ATOOLS_CONVERT_INTERVAL_CYCLE:0 "Change interval"
 ATOOLS_CONVERT_INTERVAL_CYCLE_TT:0 "Click to cycle the convert interval between §Y12§!, §Y24§!, §Y60§! and §Y120§! months. Longer = slower drift. Current value is shown below."
 atools_convert_status:0 "Every §Y[1.atools_convert_interval.GetValue]§! mo"
 ATOOLS_CONVERT_STATUS_TT:0 "How often the auto-convert pass runs (independent of the shrink interval)."
 ATOOLS_GROW_LABEL:0 "Grow weakest"
 ATOOLS_GROW_TT:0 "When §Yon§!, every §Ygrow interval§! the world's §Yleast-developed§! nation gains ground. It first §Yclaims an adjacent uncolonised province§!; failing that it §Ytakes one border province from its strongest neighbour§!; and if it is boxed in with neither option it §Ygains +1 development§! on one of its own provinces. So the smallest nations always grow, even island minors with nowhere to expand."
 ATOOLS_GROW_INTERVAL_CYCLE:0 "Change interval"
 ATOOLS_GROW_INTERVAL_CYCLE_TT:0 "Click to cycle the grow interval between §Y1§!, §Y6§!, §Y12§! and §Y24§! months. This interval is §Yseparate§! from the other tools."
 ATOOLS_GROW_STATUS_TT:0 "Interval, how many grows succeeded, and how many runs fired but could do nothing. With the +1 development fallback this should stay at zero."
 ATOOLS_ABSORB_LABEL:0 "Absorb exclaves"
 ATOOLS_ABSORB_TT:0 "When §Yon§!, every §Yabsorb interval§! any province that is §Yfully surrounded§! - with no neighbouring province belonging to its own owner - is handed to its §Yweakest adjacent nation§!. Cleans up the scattered specks the shrink and grow leave behind. Overseas colonies are §Ynot§! affected, and a nation is never absorbed out of existence."
 ATOOLS_ABSORB_INTERVAL_CYCLE:0 "Change interval"
 ATOOLS_ABSORB_INTERVAL_CYCLE_TT:0 "Click to cycle the absorb interval between §Y1§!, §Y6§!, §Y12§! and §Y24§! months. This interval is §Yseparate§! from the other tools."
 ATOOLS_ABSORB_STATUS_TT:0 "How often the absorb pass runs, and how many exclaves have been absorbed this game."
 atools_cede_status:0 "Every §Y[1.atools_cede_interval.GetValue]§! mo"
 atools_cede_done:0 "done §G[1.atools_cede_count.GetValue]§!"
 atools_cede_failed:0 "fail §R[1.atools_cede_fail_count.GetValue]§!"
 atools_grow_status:0 "Every §Y[1.atools_grow_interval.GetValue]§! mo"
 atools_grow_done:0 "done §G[1.atools_grow_count.GetValue]§!"
 atools_grow_failed:0 "fail §R[1.atools_grow_fail_count.GetValue]§!"
 atools_absorb_status:0 "Every §Y[1.atools_absorb_interval.GetValue]§! mo"
 atools_absorb_done:0 "took §G[1.atools_absorb_count.GetValue]§!"
