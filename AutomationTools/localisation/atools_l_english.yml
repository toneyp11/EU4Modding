l_english:
 AUTOMATION_TOOLS_BTN:0 "Automation"
 AUTOMATION_TOOLS_BTN_TT:0 "Open or close the §YAutomation Tools§! panel."
 AUTOMATION_TOOLS_TITLE:0 "§YAutomation Tools§!"
 AUTOMATION_CLOSE_TT:0 "Close"
 ATOOLS_CEDE_LABEL:0 "Auto-shrink: largest nation"
 ATOOLS_CEDE_TT:0 "When §Yon§!, every set number of months the nation with the highest total development is shrunk. §YFirst§!, it releases every nation it can as §Yindependent§! states; if nothing can be released, it instead cedes one border province to its §Yweakest neighbour§!. Keeps any single nation from snowballing out of control."
 ATOOLS_INTERVAL_CYCLE:0 "Shrink interval: click to cycle"
 ATOOLS_INTERVAL_CYCLE_TT:0 "Click to cycle the shrink interval between §Y1§!, §Y6§!, §Y12§! and §Y24§! months. Current value is shown below."
 atools_cede_status:0 "Interval: §Y[1.atools_cede_interval.GetValue]§! mo  |  Shrinks: §Y[1.atools_cede_count.GetValue]§!"
 ATOOLS_CEDE_STATUS_TT:0 "Current interval, and how many times the largest nation has been shrunk (released or ceded) so far this game."
 ATOOLS_CONVERT_LABEL:0 "Auto-convert religion & culture"
 ATOOLS_CONVERT_TT:0 "When §Yon§!, every §Yconvert interval§! each owned province whose religion or culture differs from its owner's has a 20%% chance to §Yconvert toward the owner§! (including same-group cases like Catholic→Orthodox that the AI never does). The map homogenises §Ygradually§! over time rather than all at once. This interval is §Yseparate§! from the shrink interval."
 ATOOLS_CONVERT_INTERVAL_CYCLE:0 "Convert interval: click to cycle"
 ATOOLS_CONVERT_INTERVAL_CYCLE_TT:0 "Click to cycle the convert interval between §Y12§!, §Y24§!, §Y60§! and §Y120§! months. Longer = slower drift. Current value is shown below."
 atools_convert_status:0 "Convert every: §Y[1.atools_convert_interval.GetValue]§! mo"
 ATOOLS_CONVERT_STATUS_TT:0 "How often the auto-convert pass runs (independent of the shrink interval)."
 ATOOLS_SPLIT_LABEL:0 "Exclave breakaway"
 ATOOLS_SPLIT_TT:0 "When §Yon§!, every so often each nation loses its §Yexclaves§! — provinces with no land route to the capital through its own territory. Contiguous land is never touched. An exclave a living independent nation §Ycores§! returns to that claimant; the rest §Ybreak away as brand-new independent nations§! (grouped by region, drawn from a pool of up to 100 tags, named after their area). (Runs on its own timer; interval control coming soon.)"
 atools.1.a:0 "OK"

